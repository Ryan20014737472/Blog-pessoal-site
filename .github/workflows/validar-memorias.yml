name: Validar memórias

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validar-memorias.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validar-memorias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Conferir site, memórias e arquivos
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar site completo
        id: validacao
        shell: bash
        run: |
          set +e
          node scripts/validar-memorias.cjs > resultado-validacao.txt 2>&1
          status=$?
          cat resultado-validacao.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enviar diagnóstico por e-mail
        if: steps.validacao.outputs.status != '0' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: node scripts/enviar-alerta-validacao.cjs resultado-validacao.txt

      - name: Marcar a validação como falha
        if: steps.validacao.outputs.status != '0'
        run: exit 1
